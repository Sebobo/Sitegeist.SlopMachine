Sitegeist:
  SlopMachine:
    agent:
      # The workspace the agent is allowed to hand its work over to. Humans review and publish it;
      # the agent has no way of addressing the live workspace. Leave it unset to disable the
      # shared workspace tools: SharedWorkspaceContextFactory then refuses every call.
      #
      # This is the workspace NAME, not its title - the content repository addresses workspaces by
      # name, and Neos generates names like "ki-review-dca36" for a workspace titled "KI-Review".
      # The name must not be the agent's own personal workspace, and the workspace must be based on
      # live; SharedWorkspaceContextFactory refuses anything else.
      #
      # Override this per context in Configuration/<Context>/Settings.yaml, because the generated
      # name differs per installation.
      sharedWorkspace: ~

      # Configuration of the upload-asset capability. Assets are not part of the content
      # repository: an upload is live immediately and no tool can take it back, so every
      # upload goes into one collection and carries a tag.
      media:
        # The asset collection every upload goes into. It is created if it does not exist.
        collectionTitle: 'MCP Uploads'
        # The largest accepted upload, in bytes.
        maxFileSize: 5242880
        # The media types that may be uploaded. The type of the content decides, not the
        # file name, so a renamed file does not slip through.
        allowedMediaTypes:
          - 'image/jpeg'
          - 'image/png'
          - 'image/gif'
          - 'image/webp'
          - 'application/pdf'
        # Every upload carries this tag, so that agent uploads are easy to find in the media
        # browser. A second tag naming the agent is added on top of it.
        tagLabel: 'mcp-upload'
